[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "foundit-hello"
dynamic = ["version"]
description = "A tiny example package demonstrating Python packaging."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James", email = "james@edera.dev" }]
keywords = ["example", "packaging", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[tool.hatch.version]
source = "vcs"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hello = "foundit_hello.cli:main"

[project.urls]
Homepage = "https://github.com/found-it/foundit-hello"
Issues = "https://github.com/found-it/foundit-hello/issues"
